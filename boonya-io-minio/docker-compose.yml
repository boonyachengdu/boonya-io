version: '3.8'
services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - minio-network

  minio-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - minio
    ports:
      - "28080:28080"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - SPRING_PROFILES_ACTIVE=docker
    restart: on-failure
    networks:
      - minio-network

volumes:
  minio-data:

networks:
  minio-network:
    driver: bridge
