server:
  port: 8083

spring:
  application:
    name: boonya-io-auth
  
  datasource:
    url: jdbc:postgresql://postgres:5432/iot_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
    
  redis:
    host: redis
    port: 6379
    database: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.boonya.lab.io.auth: DEBUG
