server:
  port: 8080

spring:
  application:
    name: boonya-io-gateway

  cloud:
    # Nacos 服务发现配置
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: public

    gateway:
      # 启用基于服务发现的自动路由
      discovery:
        locator:
          enabled: true

      routes:
        # 认证服务
        - id: auth-service
          uri: lb://boonya-io-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # 用户管理服务
        - id: user-service
          uri: lb://boonya-io-auth
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # 角色管理服务
        - id: role-service
          uri: lb://boonya-io-auth
          predicates:
            - Path=/api/roles/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # 权限管理服务
        - id: permission-service
          uri: lb://boonya-io-auth
          predicates:
            - Path=/api/permissions/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # 设备管理服务（含告警管理）
        - id: device-service
          uri: lb://boonya-io-device
          predicates:
            - Path=/api/devices/**,/api/alerts/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # IoT 核心服务（含设备历史、AI 分析、规则管理、告警）
        - id: iot-service
          uri: lb://boonya-io-iot
          predicates:
            - Path=/api/iot/**,/api/rules/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # IoT WebSocket 实时推送（SockJS/STOMP 端点，原生支持 ws 升级，不加限流避免握手失败）
        - id: iot-websocket
          uri: lb:ws://boonya-io-iot
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

        # MinIO 服务
        - id: minio-service
          uri: lb://boonya-io-minio
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # OTA 升级服务
        - id: ota-service
          uri: lb://boonya-io-ota
          predicates:
            - Path=/api/firmware/**,/api/ota/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
        # 数据分析服务（含能碳分析）
        - id: analytics-service
          uri: lb://boonya-io-analytics
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

      globalcors:
        cors-configurations:
          '[/**]':
            # allowCredentials=true 时不能用 allowedOrigins:"*"，改用 allowedOriginPatterns
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  # Spring Boot 3.x Redis 属性前缀从 spring.redis 迁移到 spring.data.redis
  data:
    redis:
      host: redis
      port: 6379
      database: 2

# JWT 配置（用于验证 Token）
jwt:
  secret: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.boonya.lab.io.gateway: DEBUG
