server:
  port: 8080

spring:
  application:
    name: boonya-io-gateway

  cloud:
    # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
    # Nacos 服务发现配置
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: public
    # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

    gateway:
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
      # 启用基于服务发现的自动路由
      discovery:
        locator:
          enabled: true
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

      routes:
        # 认证服务
        - id: auth-service
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
          uri: lb://boonya-io-auth
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
          predicates:
            - Path=/api/auth/**
          filters:
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

        # 设备管理服务
        - id: device-service
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
          uri: lb://boonya-io-device
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
          predicates:
            - Path=/api/devices/**
          filters:
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

        # IoT 核心服务
        - id: iot-service
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
          uri: lb://boonya-io-iot
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
          predicates:
            - Path=/api/iot/**
          filters:
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

        # MinIO 服务
        - id: minio-service
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
          uri: lb://boonya-io-minio
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
          predicates:
            - Path=/api/files/**
          filters:
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

        # OTA 升级服务
        - id: ota-service
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
          uri: lb://boonya-io-ota
          # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
          predicates:
            - Path=/api/firmware/**,/api/ota/**
          filters:
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"
            # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  redis:
    host: redis
    port: 6379
    database: 3

# JWT 配置（用于验证 Token）
jwt:
  secret: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.boonya.lab.io.gateway: DEBUG
