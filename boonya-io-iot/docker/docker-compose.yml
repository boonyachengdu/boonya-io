version: '3.8'
services:
  emqx:
    image: emqx/emqx:latest
    ports:
      - "1883:1883"   # MQTT
      - "18083:18083" # Dashboard

  tdengine:
    image: tdengine/tdengine:latest
    ports:
      - "6030:6030"   # JDBC端口

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"

  spring-app:
    build: .
    depends_on:
      - emqx
      - tdengine
      - redis
      - minio
    environment:
      - MQTT_BROKER=tcp://emqx:1883
      - TDENGINE_HOST=tdengine