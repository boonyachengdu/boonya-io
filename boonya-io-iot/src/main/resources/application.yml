spring:
  application:
    name: boonya-io-iot
  # 移除 Nacos 相关配置（如果不需要微服务）
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  redis:
    host: localhost
    port: 6379

  # TDengine 配置（使用 REST API 驱动，无需本地库）
  datasource:
    url: jdbc:TAOS-RS://localhost:6041/iot
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
mqtt:
  broker:
    # 可选值: embedded 或 emqx
    type: embedded
    # 嵌入式配置
    embedded-port: 1883
    allow-anonymous: true
    # 外部EMQX配置（type=emqx时生效）
    host: tcp://localhost:1883

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: DEBUG

server:
  port: 18080
