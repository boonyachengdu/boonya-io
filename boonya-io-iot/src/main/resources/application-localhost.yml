spring:
  application:
    name: boonya-io-iot
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  # Spring Boot 3.x Redis 属性前缀从 spring.redis 迁移到 spring.data.redis
  data:
    redis:
      host: localhost
      port: 6379

  # TDengine 配置（使用 REST API 驱动，URL 不指定数据库，由 TimeSeriesService 自动 CREATE DATABASE）
  datasource:
    url: jdbc:TAOS-RS://localhost:6041/
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
    # 添加连接池配置
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: -1  # 不因为初始化失败而启动失败

mqtt:
  broker:
    # 可选值: embedded 或 emqx
    type: embedded
    # 嵌入式配置
    embedded-port: 1883
    allow-anonymous: true
    # 外部EMQX配置（type=emqx时生效）
    host: tcp://localhost:1883
    username: admin
    password: public

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: DEBUG

server:
  port: 8081
