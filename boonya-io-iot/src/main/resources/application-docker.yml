spring:
  application:
    name: boonya-io-iot
  # 启用 Nacos 服务发现配置
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: nacos:8848
        namespace: public
      config:
        enabled: false
  # Spring Boot 3.x Redis 属性前缀从 spring.redis 迁移到 spring.data.redis
  # Redis 配置
  data:
    redis:
      host: redis
      port: 6379
  # Kafka 消息队列配置
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    consumer:
      group-id: boonya-io-iot
      auto-offset-reset: earliest
      enable-auto-commit: true

  # TDengine 配置（使用 REST API 驱动，URL 不指定数据库，由 TimeSeriesService 自动 CREATE DATABASE）
  datasource:
    url: jdbc:TAOS-RS://tdengine:6041/
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
    # 添加连接池配置
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: -1  # 不因为初始化失败而启动失败

# MQTT 配置（使用外部 EMQX）
mqtt:
  broker:
    type: emqx
    host: tcp://emqx:1883
    embedded-port: 1883
    allow-anonymous: true
    username: admin
    password: public

# MinIO 配置
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: INFO

server:
  port: 8081
# Actuator + Prometheus 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: boonya-io-iot
