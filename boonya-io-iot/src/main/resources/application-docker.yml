spring:
  application:
    name: boonya-io-iot
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
  # 启用 Nacos 服务发现配置
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: nacos:8848
        namespace: public
      config:
        enabled: false
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

  # Redis 配置
  redis:
    host: redis
    port: 6379

  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- start ----
  # Kafka 消息队列配置
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
    consumer:
      group-id: boonya-io-iot
      auto-offset-reset: earliest
      enable-auto-commit: true
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- end ----

  # TDengine 配置（使用 REST API 驱动，无需本地库）
  datasource:
    url: jdbc:TAOS-RS://tdengine:6041/iot
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
    # 添加连接池配置
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: -1  # 不因为初始化失败而启动失败

# MQTT 配置（使用外部 EMQX）
mqtt:
  broker:
    type: emqx
    host: tcp://emqx:1883
    embedded-port: 1883
    allow-anonymous: true
    username: admin
    password: public

# MinIO 配置
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: INFO

server:
  port: 8081

# 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- start ----
# Actuator + Prometheus 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: boonya-io-iot
# 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- end ----
