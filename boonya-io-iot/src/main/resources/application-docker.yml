spring:
  application:
    name: boonya-io-iot
  # 移除 Nacos 相关配置（如果不需要微服务）
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  # Redis 配置
  redis:
    host: redis
    port: 6379

  # TDengine 配置
  datasource:
    url: jdbc:TAOS://tdengine:6030/iot
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.TSDBDriver

# MQTT 配置（使用外部 EMQX）
mqtt:
  broker:
    type: emqx
    host: tcp://emqx:1883
    embedded-port: 1883
    allow-anonymous: true

# MinIO 配置
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: INFO
