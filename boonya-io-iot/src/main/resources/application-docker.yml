spring:
  application:
    name: boonya-io-iot
  # 移除 Nacos 相关配置（如果不需要微服务）
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

  # Redis 配置
  redis:
    host: redis
    port: 6379

  # TDengine 配置（使用 REST API 驱动，无需本地库）
  datasource:
    url: jdbc:TAOS-RS://tdengine:6041/iot
    username: root
    password: taosdata
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
    # 添加连接池配置
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: -1  # 不因为初始化失败而启动失败

# MQTT 配置（使用外部 EMQX）
mqtt:
  broker:
    type: emqx
    host: tcp://emqx:1883
    embedded-port: 1883
    allow-anonymous: true
    username: admin
    password: public

# MinIO 配置
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: iot-logs

logging:
  level:
    com.boonya.io: INFO

server:
  port: 8081
