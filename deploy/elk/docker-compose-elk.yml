version: '3.8'
services:
  elasticsearch:
    image: elasticsearch:8.5.0
    container_name: iot-es-elk
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elk-es-data:/usr/share/elasticsearch/data
    networks:
      - iot-network
    restart: unless-stopped

  logstash:
    image: logstash:8.5.0
    container_name: iot-logstash
    ports:
      - "5000:5000"
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - iot-network
    restart: unless-stopped

  kibana:
    image: kibana:8.5.0
    container_name: iot-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - iot-network
    restart: unless-stopped

volumes:
  elk-es-data:

networks:
  iot-network:
    external: true
