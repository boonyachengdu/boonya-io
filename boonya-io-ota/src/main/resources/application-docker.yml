server:
  port: 8085

spring:
  application:
    name: boonya-io-ota
  
  datasource:
    url: jdbc:postgresql://postgres:5432/iot_ota
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# MinIO 配置
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: ota-firmware

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.boonya.lab.io.ota: DEBUG

# 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- start ----
# Seata 分布式事务配置
seata:
  enabled: true
  application-id: boonya-io-ota
  tx-service-group: boonya-io-tx-group
  service:
    vgroup-mapping:
      boonya-io-tx-group: default
    grouplist:
      default: seata:8091
