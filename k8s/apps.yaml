# 应用层：6 个微服务 Deployment + ClusterIP Service
# 部署命令：kubectl apply -f apps.yaml -n boonya-iot
# 注意：镜像名格式 boonya-io/<service>:<tag>，构建后推送到镜像仓库后修改 image 字段
---
# ===== Auth Service (8083) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boonya-io-auth
  namespace: boonya-iot
  labels:
    app: boonya-io-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boonya-io-auth
  template:
    metadata:
      labels:
        app: boonya-io-auth
    spec:
      containers:
        - name: boonya-io-auth
          image: boonya-io/boonya-io-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/iot_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_REDIS_HOST
              value: redis
            - name: JWT_SECRET
              value: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: boonya-io-auth
  namespace: boonya-iot
spec:
  selector:
    app: boonya-io-auth
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
---
