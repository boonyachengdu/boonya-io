version: '3.8'

services:
  # ===== 基础设施服务 =====
  
  # PostgreSQL - 业务数据库
  postgres:
    image: postgres:15-alpine
    container_name: iot-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_device
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TDengine - 时序数据库
  tdengine:
    image: tdengine/tdengine:latest
    container_name: iot-tdengine
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6060:6060"
    environment:
      TAOS_FIRST_EP: localhost:6030
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-log:/var/log/taos
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'show databases;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis - 缓存
  redis:
    image: redis:7-alpine
    container_name: iot-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
  # Nacos - 注册配置中心
  nacos:
    image: nacos/nacos-server:v2.4.3-slim
    container_name: iot-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - iot-network
    restart: unless-stopped
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----

  # EMQX - MQTT Broker
  emqx:
    image: emqx/emqx:5.4
    container_name: iot-emqx
    ports:
      - "1883:1883"
      - "8183:8083"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      EMQX_DEFAULT_USERNAME: admin
      EMQX_DEFAULT_PASSWORD: public
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - emqx-etc:/opt/emqx/etc
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO - 对象存储
  minio:
    image: minio/minio:latest
    container_name: iot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- start ----
  # Seata - 分布式事务协调器
  seata:
    image: seataio/seata-server:2.0.0
    container_name: iot-seata
    ports:
      - "8091:8091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
    depends_on:
      - nacos
    networks:
      - iot-network
    restart: unless-stopped

  # Zookeeper - Kafka 依赖的协调服务
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: iot-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - iot-network
    restart: unless-stopped

  # Kafka - 消息队列
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: iot-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - iot-network
    restart: unless-stopped

  # Elasticsearch - SkyWalking 后端存储
  elasticsearch:
    image: elasticsearch:8.5.0
    container_name: iot-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - iot-network
    restart: unless-stopped

  # SkyWalking OAP - 链路追踪后端
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: iot-skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
    networks:
      - iot-network
    restart: unless-stopped

  # SkyWalking UI - 链路追踪可视化
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: iot-skywalking-ui
    ports:
      - "8088:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    networks:
      - iot-network
    restart: unless-stopped

  # Prometheus - 指标采集
  prometheus:
    image: prom/prometheus:latest
    container_name: iot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - iot-network
    restart: unless-stopped

  # Grafana - 指标可视化
  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - iot-network
    restart: unless-stopped
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- end ----

  # ===== 应用服务 =====

  # API 网关
  gateway:
    build:
      context: ./boonya-io-gateway
      dockerfile: Dockerfile
    container_name: iot-gateway
    depends_on:
      redis:
        condition: service_healthy
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
      nacos:
        condition: service_started
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
      auth:
        condition: service_started
      device:
        condition: service_started
      iot-app:
        condition: service_started
      minio-app:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_REDIS_HOST: redis
      JWT_SECRET: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security
    networks:
      - iot-network
    restart: on-failure

  # 认证服务
  auth:
    build:
      context: ./boonya-io-auth
      dockerfile: Dockerfile
    container_name: iot-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
      JWT_SECRET: boonya-iot-jwt-secret-key-2026-very-long-secret-for-security
    networks:
      - iot-network
    restart: on-failure

  # 设备管理服务
  device:
    build:
      context: ./boonya-io-device
      dockerfile: Dockerfile
    container_name: iot-device
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_device
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: redis
    networks:
      - iot-network
    restart: on-failure

  # IoT 核心服务
  iot-app:
    build:
      context: ./boonya-io-iot
      dockerfile: Dockerfile
    container_name: iot-core
    depends_on:
      emqx:
        condition: service_healthy
      tdengine:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
      nacos:
        condition: service_started
      # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MQTT_BROKER_HOST: tcp://emqx:1883
      TDENGINE_URL: jdbc:TAOS-RS://tdengine:6041/iot
      SPRING_REDIS_HOST: redis
    networks:
      - iot-network
    restart: on-failure

  # MinIO 服务
  minio-app:
    build:
      context: ./boonya-io-minio
      dockerfile: Dockerfile
    container_name: iot-minio-service
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    networks:
      - iot-network
    restart: on-failure

  # 数据分析服务
  analytics:
    build:
      context: ./boonya-io-analytics
      dockerfile: Dockerfile
    container_name: iot-analytics
    depends_on:
      tdengine:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TDENGINE_URL: jdbc:TAOS-RS://tdengine:6041/iot
    networks:
      - iot-network
    restart: on-failure

  # OTA 升级服务
  ota:
    build:
      context: ./boonya-io-ota
      dockerfile: Dockerfile
    container_name: iot-ota
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_ota
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    networks:
      - iot-network
    restart: on-failure

volumes:
  postgres-data:
  tdengine-data:
  tdengine-log:
  redis-data:
  emqx-data:
  emqx-log:
  emqx-etc:
  minio-data:
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- start ----
  nacos-data:
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 18:30:00 -- end ----
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- start ----
  es-data:
  grafana-data:
  # 修改内容：修改人：pengjunlin 时间：2026-08-04 19:00:00 -- end ----

networks:
  iot-network:
    driver: bridge
